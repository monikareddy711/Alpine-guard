server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/geo+json

spring:
  application:
    name: alpineguard
  datasource:
    url: ${ALPINEGUARD_DB_URL:jdbc:h2:mem:alpineguard;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${ALPINEGUARD_DB_USER:sa}
    password: ${ALPINEGUARD_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ALPINEGUARD_DB_POOL:12}
      pool-name: alpineguard-pool
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

alpineguard:
  spatial:
    default-strategy: ${ALPINEGUARD_SPATIAL_STRATEGY:kd-tree}
    proximity-radius-m: ${ALPINEGUARD_PROXIMITY_RADIUS_M:5000}
    station-dataset-size: ${ALPINEGUARD_BENCH_STATIONS:250}
  hazard:
    steep-slope-deg: ${ALPINEGUARD_STEEP_SLOPE_DEG:30}
    lee-tolerance-deg: ${ALPINEGUARD_LEE_TOLERANCE_DEG:45}
    wind-loading-gust-ms: ${ALPINEGUARD_WIND_LOADING_GUST_MS:12}
  ingest:
    seed-on-startup: ${ALPINEGUARD_SEED_ON_STARTUP:true}
    remote-base-url: ${ALPINEGUARD_INGEST_URL:}
  cache:
    telemetry-ttl-seconds: ${ALPINEGUARD_TELEMETRY_TTL:60}
    hazard-ttl-seconds: ${ALPINEGUARD_HAZARD_TTL:30}

logging:
  level:
    io.alpineguard: INFO
