name: alpineguard

services:
  postgres:
    # The official postgis/postgis tag ships an amd64 image only. This repository publishes
    # the same PostgreSQL 16 / PostGIS 3.4 build as a multi-arch manifest, so the stack also
    # starts on arm64 machines without emulation.
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_DB: alpineguard
      POSTGRES_USER: alpineguard
      POSTGRES_PASSWORD: alpineguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpineguard -d alpineguard"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      ALPINEGUARD_DB_URL: jdbc:postgresql://postgres:5432/alpineguard
      ALPINEGUARD_DB_USER: alpineguard
      ALPINEGUARD_DB_PASSWORD: alpineguard
      ALPINEGUARD_SPATIAL_STRATEGY: postgis
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  pgdata:
