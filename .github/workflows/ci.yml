name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        working-directory: backend
        run: mvn -B verify
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  frontend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npx eslint "src/**/*.ts"
      - name: Unit specs
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Production build
        working-directory: frontend
        run: npx ng build --configuration production

  e2e-docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and start the stack
        run: docker compose up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 3
          done
          docker compose logs backend
          exit 1
      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:4200; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Install Playwright browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End to end journeys
        run: npx playwright test e2e/01-dashboard.spec.ts
      - name: Capture screenshots
        run: npx playwright test e2e/99-capture-screenshots.spec.ts
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/img/
      - name: Stop the stack
        if: always()
        run: docker compose down -v
